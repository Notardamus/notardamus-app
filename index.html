<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080c20">
<title>Нотардамус: выбери карты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #080c20;
    --bg2: #141a45;
    --card: #10173a;
    --gold: #d9b25f;
    --gold-dim: #8f7840;
    --text: #f3e6c4;
    --muted: #a99d7e;
    --danger: #ff8a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); }
  body {
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(243,230,196,.55), transparent),
      radial-gradient(1px 1px at 82% 12%, rgba(243,230,196,.5), transparent),
      radial-gradient(1.5px 1.5px at 66% 64%, rgba(243,230,196,.35), transparent),
      radial-gradient(1px 1px at 24% 82%, rgba(243,230,196,.45), transparent),
      radial-gradient(1px 1px at 92% 90%, rgba(243,230,196,.4), transparent),
      radial-gradient(120% 70% at 50% -10%, var(--bg2), var(--bg) 70%);
    background-attachment: fixed;
  }
  .wrap {
    max-width: 440px; margin: 0 auto;
    padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .brand { text-align: center; color: var(--gold); letter-spacing: .18em; font-size: 12px; text-transform: uppercase; }
  h1 { margin: 6px 0 6px; text-align: center; font-size: 26px; font-weight: 700; color: var(--gold); }
  .hint { margin: 0 auto 14px; max-width: 340px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.45; }

  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .slot {
    border: 1px solid var(--gold-dim); border-radius: 10px; padding: 7px 4px; text-align: center;
    font-size: 12px; color: var(--muted); transition: all .2s ease; background: rgba(16,23,58,.5);
  }
  .slot b { display: block; font-size: 15px; color: var(--gold-dim); margin-bottom: 1px; }
  .slot.filled { border-color: var(--gold); color: var(--text); background: rgba(217,178,95,.12); }
  .slot.filled b { color: var(--gold); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
  .card {
    position: relative; padding: 0; border: 0; background: none; cursor: pointer; aspect-ratio: 2 / 3;
    border-radius: 9px; transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
    animation: deal .7s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 80ms);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
  }
  .card svg { width: 100%; height: 100%; display: block; }
  .card:hover { transform: translateY(-3px); }
  .card:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .card.selected {
    transform: translateY(-8px) scale(1.03);
    filter: drop-shadow(0 0 12px rgba(217,178,95,.75)) drop-shadow(0 8px 12px rgba(0,0,0,.5));
  }
  .card.dim { filter: saturate(.6) brightness(.8) drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .badge {
    position: absolute; left: 50%; bottom: -10px; width: 28px; height: 28px; margin-left: -14px;
    border-radius: 50%; background: var(--gold); color: #1b1405; font-weight: 700; font-size: 15px;
    display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.5);
    transform: scale(0); transition: transform .2s cubic-bezier(.3,1.6,.5,1);
  }
  .card.selected .badge { transform: scale(1); }
  @keyframes deal {
    from { opacity: 0; transform: translateY(46px) rotate(-9deg) scale(.7); }
    to { opacity: 1; transform: none; }
  }

  .status { text-align: center; min-height: 20px; margin: 4px 0 12px; font-size: 14px; color: var(--muted); }
  .actions { margin-top: auto; display: grid; gap: 10px; }
  .btn {
    width: 100%; border: 0; border-radius: 12px; padding: 15px 16px; font: inherit; font-size: 17px; font-weight: 700;
    cursor: pointer; transition: opacity .2s ease, transform .1s ease;
  }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .btn.primary { background: linear-gradient(180deg, #e7c677, var(--gold)); color: #1b1405; }
  .btn.primary:disabled { opacity: .35; cursor: default; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--gold-dim); font-size: 14px; padding: 10px; font-weight: 400; }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .error { display: none; text-align: center; color: var(--danger); font-size: 14px; margin: 8px 0; }
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 408px; margin: 0 auto; display: none;
    background: var(--card); border: 1px solid var(--gold); border-radius: 12px; padding: 12px; font-size: 13px; color: var(--text);
    word-break: break-all;
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .badge, .slot { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">⚙ Нотардамус ⚙</div>
  <h1>Выбери три карты</h1>
  <p class="hint">Доверься интуиции и нажимай на карты по очереди. Порядок важен: первая — ситуация, вторая — препятствие, третья — совет.</p>

  <div class="slots" id="slots" aria-hidden="true">
    <div class="slot"><b>1</b>Ситуация</div>
    <div class="slot"><b>2</b>Препятствие</div>
    <div class="slot"><b>3</b>Совет</div>
  </div>

  <div class="grid" id="grid" role="group" aria-label="Шесть карт рубашкой вверх"></div>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="error" id="error"></div>

  <div class="actions">
    <button class="btn primary" id="go" disabled>Открыть расклад ✨</button>
    <button class="btn ghost" id="reset" type="button">Сбросить выбор</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var inTelegram = !!(tg && tg.platform && tg.platform !== 'unknown' && typeof tg.sendData === 'function');
  var params = new URLSearchParams(location.search);
  var sid = (params.get('s') || '').replace(/[^0-9a-f]/gi, '').slice(0, 32);
  var NAMES = ['Ситуация', 'Препятствие', 'Совет'];
  var picks = [];
  var sent = false;

  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor('#080c20'); tg.setBackgroundColor('#080c20'); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  }

  function haptic(kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred('light');
    } catch (e) {}
  }

  // Рубашка карты: рамка, кольца, восьмиконечная звезда, зубцы шестерёнки
  function backSVG() {
    var s = '<svg viewBox="0 0 100 150" aria-hidden="true">' +
      '<rect x="1" y="1" width="98" height="148" rx="9" fill="#10173a" stroke="#d9b25f" stroke-width="2"/>' +
      '<rect x="6.5" y="6.5" width="87" height="137" rx="6" fill="none" stroke="#8f7840" stroke-width="1"/>';
    var cx = 50, cy = 75, i, a, r, pts = [];
    for (i = 0; i < 16; i++) {
      a = Math.PI / 8 * i - Math.PI / 2; r = i % 2 === 0 ? 24 : 10;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
    }
    s += '<circle cx="50" cy="75" r="31" fill="none" stroke="#d9b25f" stroke-width="1.6"/>' +
         '<circle cx="50" cy="75" r="26.5" fill="none" stroke="#8f7840" stroke-width=".8"/>' +
         '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#d9b25f" stroke-width="1.2"/>' +
         '<circle cx="50" cy="75" r="2.6" fill="#d9b25f"/>';
    for (i = 0; i < 24; i++) {
      a = Math.PI / 12 * i;
      s += '<line x1="' + (cx + 31 * Math.cos(a)).toFixed(1) + '" y1="' + (cy + 31 * Math.sin(a)).toFixed(1) +
           '" x2="' + (cx + 35 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + 35 * Math.sin(a)).toFixed(1) +
           '" stroke="#d9b25f" stroke-width="1.4" opacity=".75"/>';
    }
    [[17, 19], [83, 19], [17, 131], [83, 131]].forEach(function (p) {
      s += '<path d="M' + p[0] + ' ' + (p[1] - 5) + ' L' + (p[0] + 1.6) + ' ' + (p[1] - 1.6) + ' L' + (p[0] + 5) + ' ' + p[1] +
           ' L' + (p[0] + 1.6) + ' ' + (p[1] + 1.6) + ' L' + p[0] + ' ' + (p[1] + 5) + ' L' + (p[0] - 1.6) + ' ' + (p[1] + 1.6) +
           ' L' + (p[0] - 5) + ' ' + p[1] + ' L' + (p[0] - 1.6) + ' ' + (p[1] - 1.6) + ' Z" fill="#d9b25f" opacity=".85"/>';
    });
    return s + '</svg>';
  }

  var grid = document.getElementById('grid');
  var cards = [];
  for (var n = 0; n < 6; n++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'card';
    b.style.setProperty('--i', n);
    b.innerHTML = backSVG() + '<span class="badge"></span>';
    b.dataset.i = n;
    b.addEventListener('click', onCard);
    grid.appendChild(b);
    cards.push(b);
  }

  var slotEls = document.querySelectorAll('.slot');
  var statusEl = document.getElementById('status');
  var goBtn = document.getElementById('go');
  var errEl = document.getElementById('error');

  function render() {
    cards.forEach(function (el, i) {
      var order = picks.indexOf(i);
      var sel = order !== -1;
      el.classList.toggle('selected', sel);
      el.classList.toggle('dim', !sel && picks.length === 3);
      el.setAttribute('aria-pressed', sel ? 'true' : 'false');
      el.querySelector('.badge').textContent = sel ? String(order + 1) : '';
      el.setAttribute('aria-label', 'Карта ' + (i + 1) + ' из 6, ' +
        (sel ? 'выбрана как ' + NAMES[order].toLowerCase() : 'не выбрана'));
    });
    slotEls.forEach(function (el, k) { el.classList.toggle('filled', k < picks.length); });
    var left = 3 - picks.length;
    statusEl.textContent = left === 0 ? 'Карты выбраны. Открываем расклад?' :
      'Выбери ещё ' + left + (left === 1 ? ' карту' : ' карты') + ' · ' + NAMES[picks.length].toLowerCase();
    goBtn.disabled = picks.length !== 3 || sent || !sid;
  }

  function onCard(e) {
    if (sent) return;
    var i = Number(e.currentTarget.dataset.i);
    var at = picks.indexOf(i);
    if (at !== -1) picks.splice(at, 1);
    else if (picks.length < 3) picks.push(i);
    haptic('tap');
    render();
  }

  document.getElementById('reset').addEventListener('click', function () {
    if (sent) return;
    picks = [];
    haptic('tap');
    render();
  });

  goBtn.addEventListener('click', function () {
    if (picks.length !== 3 || sent || !sid) return;
    sent = true;
    goBtn.disabled = true;
    var payload = JSON.stringify({ s: sid, p: picks });
    if (inTelegram) {
      haptic('ok');
      tg.sendData(payload);  // Telegram закроет приложение и передаст выбор боту
    } else {
      // запуск вне Телеграма (проверка в браузере): показываем, что было бы отправлено
      var t = document.getElementById('toast');
      t.style.display = 'block';
      t.textContent = 'Тест вне Телеграма. Боту ушло бы: ' + payload;
      document.title = 'sent:' + payload;
    }
    render();
  });

  if (!sid) {
    errEl.style.display = 'block';
    errEl.textContent = 'Не вижу номер расклада. Вернись в чат и открой выбор карт кнопкой от бота.';
  }
  render();
})();
</script>
</body>
</html>
